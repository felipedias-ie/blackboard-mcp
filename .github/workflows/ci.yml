name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.6', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      # Build first: the test typecheck resolves against dist/ declarations,
      # which is how a consumer of the published package sees the types.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:only
